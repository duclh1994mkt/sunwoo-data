name: Kéo dữ liệu Sunwoo
on:
  schedule:
    # 08:17-22:17 Asia/Bangkok; GitHub co the khoi dong tre.
    - cron: "17 1-15 * * *"
  workflow_dispatch:
    inputs:
      che_do:
        description: "Chế độ chạy"
        required: true
        default: tang-dan
        type: choice
        options:
          - tang-dan
          - day-du
concurrency:
  group: keo-du-lieu
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  keo:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kiem tra logic
        run: python -m unittest -v test_incremental
      - name: Kéo khách từ Pancake
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANCAKE_TOKENS: ${{ secrets.PANCAKE_TOKENS }}
          PANCAKE_TOKENS_THEM: ${{ secrets.PANCAKE_TOKENS_THEM }}
          PANCAKE_TOKENS_SUA: ${{ secrets.PANCAKE_TOKENS_SUA }}
          LAY_TU_NGAY: "2026-10-21"
          SO_LUONG: "4"
        run: python incremental.py ${{ inputs.che_do || 'tang-dan' }}
